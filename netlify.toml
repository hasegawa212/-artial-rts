# MARTIAL ARTS ONE — Netlify（Next.js ランタイムは自動検出）
# DB は Netlify Database。netlify/database/migrations を本番公開の直前に自動適用する。
# 秘密（SESSION_SECRET・OIDC_CLIENT_SECRET など）はここに書かず、Netlify の環境変数に置く。
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js のサーバー機能（ページ・ログイン・DB）を Netlify Functions にする公式ランタイム。
# Git 連携のビルドでは自動で入るが、アップロードでのビルドでは入らなかったため明示する。
# バージョンは固定しない（Netlify がビルドごとに最新を使う）。
[[plugins]]
  package = "@netlify/plugin-nextjs"
